name: Build ATLite

on:
  push:
  workflow_dispatch:

env:
  THEOS: /tmp/atlite-theos
  THEOS_PACKAGE_SCHEME: roothide

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -eux
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install ldid xz make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          command -v ldid

      # iOS14+ SpringBoard injection needs the versioned arm64e ABI.
      # Use Apple's Xcode compiler/linker, not the legacy Linux clang11 toolchain.
      - name: Setup Theos
        run: |
          set -eux
          xcodebuild -version
          xcrun --sdk iphoneos clang --version
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          "$THEOS/bin/install-sdk" latest
          ls "$THEOS/sdks"

      # Theos 官方无 roothide scheme 模块(vendor/mod 仅有 rootless, 其 deb.mk 强制
      # THEOS_PACKAGE_ARCH := iphoneos-arm64, 不匹配 roothide 设备的 iphoneos-arm64e)。
      # 自制 roothide 模块, 严格对齐官方 roothide/theos 的 vendor/mod/roothide:
      #   package.mk 为空(不设前缀! roothide 包是 rootful 式无前缀布局,
      #   roothide dpkg 在 vroot 环境运行, jbroot 为根, 自动装进随机 jbroot;
      #   实证: 官方 com.roothide.patcher deb 内路径为 ./Applications/Patcher.app),
      #   package/deb.mk 强制 Architecture=iphoneos-arm64e。
      # _THEOS_SCHEME_STAGE 由 common.mk 自动推导, 无需 instance/rules.mk。
      # 详见 docs/RESEARCH.md A5/A6、docs/ERRORS.md E22
      - name: Setup roothide scheme module
        run: |
          set -ux
          mkdir -p "$THEOS/vendor/mod/roothide/package"
          : > "$THEOS/vendor/mod/roothide/package.mk"
          printf 'ifneq ($(THEOS_PACKAGE_ARCH),iphoneos-arm64e)\nTHEOS_PACKAGE_ARCH := iphoneos-arm64e\nendif\n' > "$THEOS/vendor/mod/roothide/package/deb.mk"
          # 注意: 主仓库 $THEOS/lib/iphone/rootless 是空壳, 真正的库在
          # $THEOS/vendor/lib/iphone/rootless (recursive clone 的子模块, run#20 日志证实)
          ls "$THEOS/vendor/lib/iphone/rootless/" | head -5
          mkdir -p "$THEOS/lib/iphone/roothide"
          cp -r "$THEOS/vendor/lib/iphone/rootless/." "$THEOS/lib/iphone/roothide/"
          test -f "$THEOS/lib/iphone/roothide/libroot.a"
          echo SETUP_SCHEME_OK

      - name: Verify pinned Lua 5.3.6
        run: |
          set -eux
          python3 -c "import hashlib,json,pathlib; p=pathlib.Path('tweak/lib/lua53'); m=json.loads((p/'SHA256.json').read_text()); assert len(list(p.glob('*.c')))==33; assert all(hashlib.sha256((p/k).read_bytes()).hexdigest()==v for k,v in m.items())"
          # loslib keeps system(cmd) only outside iOS; the exposed library whitelist excludes os.
          grep -q '__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__' tweak/lib/lua53/loslib.c

      - name: Behavioral regressions
        run: |
          set -eux
          python3 -m pip install lupa==2.8
          python3 -m unittest discover -s tests -v

      # 构建纪律铁律第 2 条：CI 脚本天生可诊断。断言先于构建跑，
      # 让"断言不过"与"编译不过"在日志里是两个独立且可区分的步骤。
      - name: Static assertions
        run: |
          set -x
          python3 --version
          python3 tools/verify_static.py

      - name: Build package
        run: |
          set -eux
          make package FINALPACKAGE=1
          for deb in packages/*.deb; do python3 tools/verify_artifact.py "$deb"; done
          # 探针必须 stage 进 app bundle（出 /var/containers/Bundle 会 exec EPERM）
          find .theos -name 'ATLiteProbe' -print
          test -n "$(find .theos -name 'ATLiteProbe' -print -quit)"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: atlite-deb
          path: packages/*.deb
