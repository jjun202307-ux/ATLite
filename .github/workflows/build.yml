name: Build ATLite

on:
  push:
  workflow_dispatch:

env:
  THEOS: /tmp/atlite-theos
  THEOS_PACKAGE_SCHEME: roothide

jobs:
  build:
    # 2026-11-06: GitHub macOS arm64 托管池容量紧张, 单跑 macos-14 连续 5 次
    # 排队 15 分钟拿不到 runner 被取消(注解: "not acquired by Runner ... after
    # multiple attempts")。改三路矩阵: arm64 两版 + macos-13(Intel, 独立池),
    # 谁先拿到 runner 谁构建。iOS 交叉编译产物与宿主架构无关, Intel 产物等价。
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -eux
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install ldid xz make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          command -v ldid

      # iOS14+ SpringBoard injection needs the versioned arm64e ABI.
      # Use Apple's Xcode compiler/linker, not the legacy Linux clang11 toolchain.
      # 网络抖动会导致 theos clone(recursive 含子模块) 瞬时失败(11-05 实证)。
      # 拆分重试, 让日志能区分"clone 挂"还是后续"SDK/工具链挂"。
      - name: Clone Theos
        run: |
          set -eux
          xcodebuild -version
          xcrun --sdk iphoneos clang --version
          for i in 1 2 3; do
            rm -rf "$THEOS"
            if git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"; then
              break
            fi
            echo "theos clone attempt $i failed, retrying in 20s"
            sleep 20
            test "$i" = 3 && exit 1
          done

      # G2 根因: 之前固定下载 iPhoneOS16.5.sdk, 产出旧 arm64e ABI 二进制,
      # 缺 __objc_stubs/__auth_ptr, iOS 15+ dyld 不加载(本地 clang-11 同因)。
      # theos/sdks 仓库无 18.x; 官方 0.3.44 的 sdk=18.5 来自 Xcode 自带 SDK。
      # 用 THEOS_PLATFORM_SDK_ROOT 让 theos 自动发现 Xcode 自带 iphoneos SDK
      # (darwin_head.mk: _XCODE_SDK_DIR = THEOS_PLATFORM_SDK_ROOT/Platforms/iPhoneOS.platform/Developer/SDKs),
      # 新版 clang + arm64e 新 ABI + SDK 18.x 自动对齐, 且无需下载(绕开限流)。
      - name: Setup Theos SDK
        run: |
          set -eux
          xcrun --sdk iphoneos clang --version
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "Xcode iphoneos SDK: $SDK_PATH"
          # SDK_PATH 形如 .../Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS18.5.sdk
          # 反推 Developer 目录作为 THEOS_PLATFORM_SDK_ROOT
          THEOS_PLATFORM_SDK_ROOT="$(echo "$SDK_PATH" | sed 's#/Platforms/.*##')"
          echo "THEOS_PLATFORM_SDK_ROOT: $THEOS_PLATFORM_SDK_ROOT"
          echo "THEOS_PLATFORM_SDK_ROOT=$THEOS_PLATFORM_SDK_ROOT" >> "$GITHUB_ENV"
          ls "$THEOS_PLATFORM_SDK_ROOT/Platforms/iPhoneOS.platform/Developer/SDKs/"

      # Theos 官方无 roothide scheme 模块(vendor/mod 仅有 rootless, 其 deb.mk 强制
      # THEOS_PACKAGE_ARCH := iphoneos-arm64, 不匹配 roothide 设备的 iphoneos-arm64e)。
      # 自制 roothide 模块, 严格对齐官方 roothide/theos 的 vendor/mod/roothide:
      #   package.mk 为空(不设前缀! roothide 包是 rootful 式无前缀布局,
      #   roothide dpkg 在 vroot 环境运行, jbroot 为根, 自动装进随机 jbroot;
      #   实证: 官方 com.roothide.patcher deb 内路径为 ./Applications/Patcher.app),
      #   package/deb.mk 强制 Architecture=iphoneos-arm64e。
      # _THEOS_SCHEME_STAGE 由 common.mk 自动推导, 无需 instance/rules.mk。
      # 详见 docs/RESEARCH.md A5/A6、docs/ERRORS.md E22
      - name: Setup roothide scheme module
        run: |
          set -ux
          mkdir -p "$THEOS/vendor/mod/roothide/package"
          : > "$THEOS/vendor/mod/roothide/package.mk"
          printf 'ifneq ($(THEOS_PACKAGE_ARCH),iphoneos-arm64e)\nTHEOS_PACKAGE_ARCH := iphoneos-arm64e\nendif\n' > "$THEOS/vendor/mod/roothide/package/deb.mk"
          # 注意: 主仓库 $THEOS/lib/iphone/rootless 是空壳, 真正的库在
          # $THEOS/vendor/lib/iphone/rootless (recursive clone 的子模块, run#20 日志证实)
          ls "$THEOS/vendor/lib/iphone/rootless/" | head -5
          mkdir -p "$THEOS/lib/iphone/roothide"
          cp -r "$THEOS/vendor/lib/iphone/rootless/." "$THEOS/lib/iphone/roothide/"
          test -f "$THEOS/lib/iphone/roothide/libroot.a"
          echo SETUP_SCHEME_OK

      - name: Verify pinned Lua 5.3.6
        run: |
          set -eux
          python3 -c "import hashlib,json,pathlib; p=pathlib.Path('tweak/lib/lua53'); m=json.loads((p/'SHA256.json').read_text()); assert len(list(p.glob('*.c')))==33; assert all(hashlib.sha256((p/k).read_bytes()).hexdigest()==v for k,v in m.items())"
          # loslib keeps system(cmd) only outside iOS; the exposed library whitelist excludes os.
          grep -q '__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__' tweak/lib/lua53/loslib.c

      # 2026-11-08: 移除 `pip install lupa==2.8`。根因：lupa 2.8 在
      # macos-15-intel runner (Python 3.12) 上唯一的 x86_64 wheel 平台标签为
      # macosx_10_13_x86_64 (cp312-abi3)，pip 匹配失败即回退 sdist 现场编译
      # LuaJIT + lupa C 扩展，卡死 1 小时+（日志 blob 无 flush）。
      # 实际仅 3 个测试依赖 lupa (test_email_script/test_extensions_lua/
      # test_phone_flow)，且均以 @unittest.skipUnless(LuaRuntime) 兜底，
      # 未安装时自动 skip 而非失败。故 CI 不再安装 lupa，本地按需自装。
      - name: Behavioral regressions
        run: |
          set -eux
          python3 -m unittest discover -s tests -v

      # 构建纪律铁律第 2 条：CI 脚本天生可诊断。断言先于构建跑，
      # 让"断言不过"与"编译不过"在日志里是两个独立且可区分的步骤。
      - name: Static assertions
        run: |
          set -x
          python3 --version
          python3 tools/verify_static.py

      - name: Build package
        run: |
          set -eux
          make package FINALPACKAGE=1
          for deb in packages/*.deb; do python3 tools/verify_artifact.py "$deb"; done
          # 探针必须 stage 进 app bundle（出 /var/containers/Bundle 会 exec EPERM）
          find .theos -name 'ATLiteProbe' -print
          test -n "$(find .theos -name 'ATLiteProbe' -print -quit)"

      - name: Build isolated on-device storage test
        run: |
          set -eux
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 -fobjc-arc -framework Foundation tests/native_registration_backup.m shared/ATLRegistrationJob.m -o packages/ATLBackupSelfTest
          ldid -Sprobe/entitlements.plist packages/ATLBackupSelfTest

      - name: Build isolated touch diagnostic
        run: |
          set -eux
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 tests/diagnostic_home_swipe.c -o packages/ATLHomeSwipeTest
          ldid -Stests/diagnostic_swipe_entitlements.plist packages/ATLHomeSwipeTest

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: atlite-deb-${{ matrix.os }}
          path: |
            packages/*.deb
            packages/ATLBackupSelfTest
            packages/ATLHomeSwipeTest
