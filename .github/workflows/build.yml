name: Build ATLite

on:
  push:
  workflow_dispatch:

env:
  THEOS: /home/runner/theos
  THEOS_PACKAGE_SCHEME: roothide

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 官方 install-theos 脚本要求的依赖: ldid(打包签名,Ubuntu apt 无此包,取 Procursus 官方二进制)
      # + xz-utils(解压工具链与 SDK)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl perl rsync xz-utils fakeroot git
          sudo curl -sL -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid
          ldid -V | head -1

      # 官方安装规则:
      # 1) theos 本体 (recursive, 含 vendor/logos 等)
      # 2) 工具链: L1ghtmann/llvm-project latest, iOSToolchain-x86_64.tar.xz -> $THEOS/toolchain/
      # 3) SDK: $THEOS/bin/install-sdk latest
      - name: Setup Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJf - -C $THEOS/toolchain/
          $THEOS/bin/install-sdk latest
          test -x $THEOS/toolchain/linux/iphone/bin/clang
          $THEOS/toolchain/linux/iphone/bin/clang --version | head -1
          ls $THEOS/sdks

      # Theos 官方无 roothide scheme 模块(vendor/mod 仅有 rootless, 其 deb.mk 强制
      # THEOS_PACKAGE_ARCH := iphoneos-arm64, 不匹配 roothide 设备的 iphoneos-arm64e)。
      # 自制 roothide 模块: 布局前缀 /rootfs/var/jb + Architecture iphoneos-arm64e。
      # 结构仿 rootless 模块(package.mk 设前缀 + package/deb.mk 设 ARCH),
      # _THEOS_SCHEME_STAGE 由 common.mk 自动推导, 无需 instance/rules.mk。
      # 详见 docs/BUILD_PLAN.md F24-F27
      - name: Setup roothide scheme module
        run: |
          set -ux
          mkdir -p "$THEOS/vendor/mod/roothide/package"
          printf 'THEOS_PACKAGE_INSTALL_PREFIX = /rootfs/var/jb\n' > "$THEOS/vendor/mod/roothide/package.mk"
          printf 'ifneq ($(THEOS_PACKAGE_ARCH),iphoneos-arm64e)\nTHEOS_PACKAGE_ARCH := iphoneos-arm64e\nendif\n' > "$THEOS/vendor/mod/roothide/package/deb.mk"
          # 注意: 主仓库 $THEOS/lib/iphone/rootless 是空壳, 真正的库在
          # $THEOS/vendor/lib/iphone/rootless (recursive clone 的子模块, run#20 日志证实)
          ls "$THEOS/vendor/lib/iphone/rootless/" | head -5
          mkdir -p "$THEOS/lib/iphone/roothide"
          cp -r "$THEOS/vendor/lib/iphone/rootless/." "$THEOS/lib/iphone/roothide/"
          test -f "$THEOS/lib/iphone/roothide/libroot_oldabi.a"
          echo SETUP_SCHEME_OK

      # 注意: lua/lua 仓库所有源码都在根目录(没有 src/ 子目录, src/ 布局仅存在于官方 tarball)。
      # 必须删除: lua.c/luac.c/onelua.c(含 main(), 链接 dylib 会符号冲突)
      #           ltests.c(调试文件, 不在官方默认构建列表, 会重定义内部符号)
      - name: Vendor Lua 5.3.6
        run: |
          git clone --depth=1 --branch v5.3.6 https://github.com/lua/lua.git tweak/lib/lua53
          cd tweak/lib/lua53
          rm -rf .git manual testes makefile all
          rm -f lua.c luac.c onelua.c ltests.c ltests.h
          ls *.h | head -5
          ls *.c | wc -l

      # iOS SDK 将 system() 标记为 unavailable(硬错误): 把 os.execute 改为恒失败桩
      - name: Patch loslib.c for iOS
        run: |
          cd tweak/lib/lua53
          grep -n "int stat = system(cmd);" loslib.c
          sed -i 's|int stat = system(cmd);|int stat = -1; if (cmd == NULL) { lua_pushboolean(L, 0); return 1; } /* system() unavailable on iOS */|' loslib.c
          ! grep -q "system(cmd)" loslib.c

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: atlite-deb
          path: packages/*.deb
